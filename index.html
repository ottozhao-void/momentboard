<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Momentboard — Temporal Grounding Leaderboards</title>
  <meta name="description" content="Method rankings for temporal sentence grounding and video moment retrieval, compiled from published results.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23B45309'/%3E%3Crect x='6' y='13' width='20' height='6' rx='3' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#/" aria-label="Momentboard home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Momentboard</span>
      </a>
      <div class="header-actions">
        <nav class="nav" aria-label="Primary">
          <a href="#/" class="nav-link" data-route="home">Benchmarks</a>
          <a href="#/about" class="nav-link" data-route="about">About &amp; sources</a>
        </nav>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle light / dark theme">
          <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="view" class="view">
    <noscript><p class="wrap">This leaderboard needs JavaScript to render.</p></noscript>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p class="footer-note">
        Numbers are as reported in the source papers, compiled from the
        VideoMind benchmark tables and the R2-Tuning paper. Discrepancies
        across papers reflect different evaluation settings.
      </p>
      <p class="footer-meta">Momentboard · temporal sentence grounding · video moment retrieval</p>
    </div>
  </footer>

  <script>
    /* Apply saved theme before first paint to avoid a flash of the wrong mode. */
    (function () {
      try {
        var saved = localStorage.getItem("momentboard-theme");
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) {}
    })();
  </script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
